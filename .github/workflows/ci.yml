name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bible_artisan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bible_artisan_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/bible_artisan_test
      # Shared 2-vCPU runners are noisy: the concurrent search p95 is measured and printed, but held
      # to a looser bound than NFR-PERF-002's 750 ms production target (ADR 0001, BIB-16 addendum).
      SEARCH_P95_BUDGET_MS: '2000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @bible-artisan/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Migrations must apply cleanly to an empty database, and roll forward reproducibly.
      - run: pnpm db:migrate
      # The pinned WEB corpus imports from the committed artifact (no network) and validates.
      - run: pnpm corpus:import
      - run: pnpm test:integration
      - run: pnpm build
